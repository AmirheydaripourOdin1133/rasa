<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="rasaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0D9488" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#F0FDFA"/>
  <circle cx="256" cy="256" r="210" fill="#CCFBF1" fill-opacity="0.45"/>
  <g filter="url(#softGlow)">
    <!-- Main leaf / bird body -->
    <path d="M150 340 C150 240, 220 160, 320 140 C320 230, 250 320, 150 340 Z" fill="url(#rasaGrad)"/>
    <!-- Rising wing toward freedom -->
    <path d="M220 320 C255 210, 355 170, 390 120 C390 200, 325 285, 220 320 Z" fill="url(#wingGrad)" opacity="0.92"/>
    <circle cx="355" cy="130" r="22" fill="#14B8A6"/>
    <!-- Supporting path curve -->
    <path d="M130 365 C210 398, 310 388, 385 342" stroke="#0D9488" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>
</svg>