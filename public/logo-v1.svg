<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="rasaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0D9488" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#F0FDFA"/>
  <circle cx="256" cy="256" r="190" fill="#CCFBF1" fill-opacity="0.5"/>
  <g filter="url(#softGlow)">
    <!-- Minimalist stylized bird / sprouting leaf symbolizing liberation, vitality and recovery -->
    <path d="M160 330 C160 250, 220 180, 310 160 C310 240, 250 310, 160 330 Z" fill="url(#rasaGrad)"/>
    <path d="M220 310 C250 220, 340 180, 370 140 C370 210, 310 280, 220 310 Z" fill="url(#wingGrad)" opacity="0.9"/>
    <circle cx="340" cy="145" r="18" fill="#14B8A6"/>
    <!-- Gentle upward sunrise arc / path toward freedom -->
    <path d="M140 350 C210 380, 300 370, 370 330" stroke="#0D9488" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>